name: Build Android release APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize first-time key provisioning across tags and manual runs.
concurrency:
  group: pi-remote-android-signing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK & accept licenses
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          sdkmgr="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          yes | "$sdkmgr" --licenses >/dev/null 2>&1 || true
          "$sdkmgr" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - run: npm --prefix apps/mobile-app ci --workspaces=false --include=dev
      - run: node --test apps/mobile-app/test/rn-crypto.test.mjs
      - run: npm --prefix apps/mobile-app run typecheck
      - name: Verify Android native autolinking modules
        working-directory: apps/mobile-app
        run: |
          set -euo pipefail
          node node_modules/expo/bin/autolinking resolve -p android --json | node -e "const m=JSON.parse(require('fs').readFileSync(0,'utf8')).modules; const names=new Set(m.map(x=>x.packageName)); const required=['expo','expo-modules-core','expo-asset','expo-constants','expo-file-system','expo-font','expo-keep-awake','expo-camera','expo-crypto','expo-haptics','expo-local-authentication','expo-secure-store','expo-system-ui']; for (const n of required) if (!names.has(n)) throw new Error('Missing Android Expo module: '+n); console.log('Verified '+names.size+' Expo Android modules');"
          node node_modules/expo/bin/autolinking react-native-config -p android --json | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')).dependencies; const pkg=d?.['react-native-safe-area-context']?.platforms?.android?.packageInstance; if (pkg !== 'new SafeAreaContextPackage()') throw new Error('Unexpected SafeAreaContextPackage: '+pkg); console.log('Verified '+pkg);"
      - name: Generate Android project
        working-directory: apps/mobile-app
        run: npx expo prebuild --platform android --clean --non-interactive --no-install --skip-dependency-update react-native
      - name: Assemble aligned, unsigned release APK
        working-directory: apps/mobile-app/android
        run: |
          set -euo pipefail
          # SDK 53's template explicitly signs release with signingConfigs.debug.
          sed -i '/^        release {$/,/^        }$/ s/signingConfig signingConfigs.debug/signingConfig null/' app/build.gradle
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # Optional: one-time provisioning token with repository Secrets: write.
          # Remove it after the first run; later runs only read the signing secrets.
          GH_TOKEN: ${{ secrets.ANDROID_KEYSTORE_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          ks="$RUNNER_TEMP/pi-remote.keystore"
          trap 'rm -f "$ks"' EXIT
          export KEY_ALIAS="${KEY_ALIAS:-pi-remote}"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            : "${STORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD for the supplied keystore}"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ks"
          else
            if [[ -z "$STORE_PASSWORD" ]]; then
              export STORE_PASSWORD="$(openssl rand -hex 32)"
              echo "::add-mask::$STORE_PASSWORD"
            fi
            export KEY_PASSWORD="${KEY_PASSWORD:-$STORE_PASSWORD}"
            keytool -genkeypair -noprompt -storetype JKS -keystore "$ks" -alias "$KEY_ALIAS" \
              -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD -keyalg RSA -keysize 3072 \
              -validity 10000 -dname 'CN=PI Remote Android'
            if [[ -n "$GH_TOKEN" ]]; then
              printf '%s' "$STORE_PASSWORD" | gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY"
              base64 -w0 "$ks" | gh secret set ANDROID_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY"
            else
              echo '::warning::Using a one-build signing key. Configure signing secrets or the bootstrap token for in-place upgrades.'
            fi
          fi
          export KEY_PASSWORD="${KEY_PASSWORD:-$STORE_PASSWORD}"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          input=apps/mobile-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          output=pi-remote-android-release.apk
          "$signer" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD --out "$output" "$input"
          "$signer" verify --verbose --print-certs "$output"

      - uses: actions/upload-artifact@v4
        with:
          name: pi-remote-android-release
          path: pi-remote-android-release.apk
          if-no-files-found: error
